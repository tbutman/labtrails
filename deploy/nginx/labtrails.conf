# LabTrails: static files only. Everything a user records stays in their browser, so there is
# nothing to log: no access log, and errors go to the container log (capped by Docker).
#
# Installed in the trails-static nginx's conf.d with labtrails-headers.conf beside it. The live
# release is /srv/labtrails/current (a symlink swapped by trails-deploy.sh).

server {
    listen 80;
    listen [::]:80;
    server_name www.labtrails.app;
    access_log off;
    include /etc/nginx/conf.d/labtrails-headers.conf;
    return 301 https://labtrails.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name labtrails.app;

    root /srv/labtrails/current;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Hashed build files never change.
    location /assets/ {
        include /etc/nginx/conf.d/labtrails-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # pdf.js support files: versioned with the app, cached for a week.
    location /vendor/ {
        include /etc/nginx/conf.d/labtrails-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The web app manifest: nginx's default list has no type for it. An empty types block here
    # (not at server level, where it would replace every other type) lets default_type apply.
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/labtrails-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The service worker must be re-checked on every load, or updates get stuck.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include /etc/nginx/conf.d/labtrails-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The app: real files as they are, and every other path gets index.html (client-side routes).
    location / {
        include /etc/nginx/conf.d/labtrails-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
