# Security headers for LabTrails, included in every location: nginx's add_header in a location
# replaces the server-level ones, so each location includes this file instead.
#
# The Content-Security-Policy allows network requests only to the app itself and Anthropic's API
# (for AI features, with the user's own key). 'wasm-unsafe-eval' lets Argon2id and pdf.js compile
# WebAssembly; it doesn't allow JavaScript eval. The built index.html carries the same policy as a
# <meta> tag (vite.config.ts); keep the two in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=(), web-share=(self), browsing-topics=(), interest-cohort=()" always;
